services:
  breast-cancer-ai:
    build: .
    container_name: breast-cancer-ai
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
    command: streamlit run app/Home.py --server.address=0.0.0.0 --server.port=8501

